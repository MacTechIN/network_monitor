# netmon gateway DHCP/DNS  (/etc/dnsmasq.d/netmon-gateway.conf)
# 공유기의 DHCP 서버를 반드시 끈 뒤에 활성화할 것 (02_enable_dhcp.sh)
interface=eth0
bind-interfaces
except-interface=tailscale0
domain-needed
bogus-priv
# 임대 범위: Pi(.162)와 공유기(.1) 제외
dhcp-range=192.168.45.20,192.168.45.150,255.255.255.0,1h
dhcp-option=option:router,192.168.45.162
dhcp-option=option:dns-server,192.168.45.162
dhcp-authoritative
# 상위 DNS (통신사 DNS, 현재 공유기가 배포하던 값)
no-resolv
server=210.220.163.82
server=219.250.36.130
cache-size=2000
# DNS 질의 로그 -> 추후 탐지기 입력
log-queries
log-dhcp
log-facility=/var/log/netmon/dnsmasq.log
